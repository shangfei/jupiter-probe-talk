## 报告提纲

1. 背景：木星系为何是太阳星云的“化石”
2. 早期大撞击（giant impact）与稀释核（dilute core）
3. 撞击时标与环行星盘（circumplanetary disk）的初始条件
4. 环行星盘模型与 JWST 观测约束
5. 木卫四（Callisto）：晚期吸积环境的探针
6. 天问四号：科学目标与可测约束

## 木星系：太阳星云晚期的“化石记录”

.readable.short[
- **朱诺号**（Juno）重力场：木星内部存在**稀释核**（dilute core），重元素向外延展至约半个半径
]

--

.readable.short[
- **伽利略卫星**（Galilean satellites）：密度由内向外递减——冰–岩梯度
]

--

.readable.short[
- **木卫四**（Callisto）：转动惯量偏大，仅部分分异（differentiation），几乎无地质活动
]

--

.center[.large[三者共同反映：原行星盘（protoplanetary disk, PPD）向环行星盘（circumplanetary disk, CPD）过渡时的物质分配与动力学]]

.footnote[Wahl et al. 2017, GRL；Anderson et al. 2001, Icarus；Canup &amp;amp; Ward 2002, AJ]

???
开场一句：木星系既有行星本体的内部信息，又有卫星系统的成分梯度，二者都在太阳星云晚期定形。
三条观测证据各对应一个物理过程：核的形成与改造、CPD 中固体的温度分布、最外侧卫星的低热吸积。

.readable[
- 密度向外递减 `\(\Rightarrow\)` 冰质量分数向外升高
- 指向 CPD 中存在**温度梯度**与**雪线**（snow line）
- 木卫四转动惯量因子（moment of inertia factor） `\(C/MR^2\approx 0.355\)`：未完全分异
]

.footnote[Schubert et al. 2004, in *Jupiter*, CUP；Anderson et al. 2001, Icarus]

???
木卫三 C/MR² ≈ 0.31，已强烈分异；木卫四 ≈ 0.355，说明吸积时加热很弱、冰岩没有完全分离。
这一对比是后面“木卫四作为探针”的伏笔。

## 转动惯量偏大

- Galileo 多次近飞多普勒给出重力四极矩 `\(C_{22}\)`
- 流体静力假设 + Radau → `\(C/MR^2=0.3549\pm0.0042\)`（Anderson et al. 2001）
- 对照：均一 ~0.40；未分异（含冰相变）~0.38；木卫三 ~0.31
- 偏大意味着**不完全分异**（冰–岩混合可深达内部；见右图两层模型族）
- 指向吸积偏慢、CPD 晚期偏冷；天问四号可再测重力与潮汐

.footnote[Anderson et al. 2001, Icarus；McKinnon 1997；Schubert et al. 2004；Gao &amp;amp; Stevenson 2013]

???
Galileo 赤道飞掠给出 C22，在静力平衡下推出 MOI。
右图取自 Anderson et al. 2001 Fig.1：满足质量与转动惯量的两层模型族；粗实/虚线对应名义与 ±1σ 的 C22，细线为外壳厚度（km）。
与木卫三不同，不能建成完全冰壳+岩铁核模型，故为部分分异；这约束 CPD 晚期要冷、吸积要慢。
感应磁场暗示有地下海洋，与外层有冰/液态水、深处仍混合并不矛盾。

.large[
- 木星的**稀释核**如何形成？
- 它与**环行星盘**的诞生有何关联？
- 能否用**卫星的性质**反推当时的 CPD 条件？

&lt;br&gt;

.large[把木星内部、CPD 与卫星放在同一条形成时间线上]

由形成端给出木卫四分异、冰–岩比与地下海洋的约束
]

三个问题对应报告的三个部分。强调“同一条时间线”：撞击的时刻决定 CPD 的初始条件，CPD 又决定卫星的吸积环境。
口头点明：形成端给出初始条件与内部结构先验，供天问四号重力与潮汐测量对照。

## 朱诺号揭示的稀释核

- 重力矩（gravitational moments） `\(J_{2n}\)` 要求核区**密度梯度平缓**
- 重元素延展至 `\(\sim 0.3\text{–}0.5\,R_{\mathrm{J}}\)`
- 经典核吸积模型（core accretion）预言**致密核**
- 稀释核需要**额外的混合机制**

.footnote[Wahl et al. 2017, GRL；Militzer et al. 2022, PSJ]

???
要点：朱诺号测得的偶次重力矩与致密小核模型不符。
对流侵蚀核的效率在木星条件下不足以在 4.5 Gyr 内形成如此延展的结构，因此需要早期的、能量很大的事件。

## 撞击发生的可能性

- N 体：年轻木星附近胚胎丰富；数 Myr 内撞击概率**至少约 40%**
- **引力聚焦**（gravitational focusing）：质量大、半径大 → 有效碰撞截面增大
- 碰撞角：正面/近正面比擦边更常见；约一半 merger 的碰撞角 `\(\lesssim 30^\circ\)`
- 打碎致密核并形成稀释核：需约 `\(10\,M_\oplus\)` 胚胎的**正面**撞击；擦边不足以充分混合

## 木星失控吸积

- 失控气体吸积开始后：`\(M(t)=M_{\mathrm{J}}-(M_{\mathrm{J}}-M_{\mathrm{p}})e^{-t/t_{\mathrm{grow}}}\)`
- `\(M_{\mathrm{p}}=10\,M_{\oplus}\)`, `\(M_{\mathrm{J}}\simeq 318\,M_{\oplus}\)`, `\(t_{\mathrm{grow}}=0.2\)` Myr（20 万年）
- 约 `\(0.45\)` Myr 达到 `\(0.9\,M_{\mathrm{J}}\)`
- 撞击发生在质量快速增长之后（见后页）

.footnote[Liu et al. 2019, Nature]

???
木星质量按指数增长进入失控吸积；约半 Myr 达九成木星质量后，胚胎更易被激发并撞击（下一页）。

## N 体模拟：撞击时刻

撞击时间取决于：
- 行星胚胎（planetary embryo）质量
- 初始轨道参数
- 木星质量增长速率

`\(\Rightarrow\)` 存在一定的**时间窗口**

共同点是：撞击时木星已完成**失控气体吸积**（runaway gas accretion）

.footnote[Liu et al. 2019, Nature]

???
木星质量快速增长时，Hill 半径扩大、共振位置移动，附近胚胎被激发到穿越轨道。
不同参数组合使撞击时刻前后移动，但都落在失控吸积结束之后。下一页用碰撞时间直方图展示这一窗口的宽度——弥散很大。

## 共面模型中的撞击时刻分布

- 碰撞时间跨越约 `\(10^{3}\)`–`\(10^{6}\)` yr
- 峰位随生长参数 `\(k\)` 系统性移动
- 分布**宽度大**，并非集中于单一时标

因此 CPD 的初始热状态与成分窗口本身具有显著不确定性


???
共面扫描中，碰撞时刻从约 \(10^{3}\) 延展到 \(10^{6}\) 年量级；\(k\) 增大时峰位整体后移。
图中 \(N_{\mathrm{total}}\) 是碰撞事件数，与蒙特卡洛随机实现次数不同；实现规模约 \(10^{3}\)。
对 CPD：撞击注入能量与固体的时刻并不唯一，初始条件应作为分布来理解。

## 倾角扫描中的撞击时刻分布

- 倾角增大 → 碰撞次数显著下降
- 尖峰变平缓，并向更晚时刻延伸
- 非共面情形下，**弥散进一步放大**

能量与固体能否、何时注入，强烈依赖初始轨道倾角


???
共面时分布相对尖锐；稍有倾角，碰撞变少、分布展宽并拖向 \(10^{6}\) yr。
口头可提：土星模型及 \(f=2\) 扫描给出同类结论，峰值与宽度随参数变化，但大弥散是共性。
这对环行星盘初始条件很关键——不能只取一个“典型撞击时刻”。

## CPD 参数化模型 + 辐射转移

- 参数：盘质量、径向结构、尘埃演化、加热源
- 辐射转移（radiative transfer）计算 `\(\Rightarrow\)` 合成光谱能量分布（spectral energy distribution, SED）
- 系统构建**不同演化阶段**的 CPD 结构

.footnote[Sun, Huang, Dong &amp;amp; Liu 2024, ApJ]

???
参数化的好处：可以把撞击给出的初始条件、以及观测拟合给出的约束放进同一组参数。
加热源包括行星本身的光度、黏滞耗散以及外部星光。

## JWST 约束下的环行星盘

- 对象：年轻系外巨行星与**行星质量天体**（planetary-mass objects）
- 光谱拟合约束：盘质量、径向结构、尘埃与热条件

# .num[四、]木卫四：晚期吸积环境的探针

## 为什么是木卫四？

- 位于最外侧，**热演化最弱**
- 转动惯量偏大 → **不完全分异**，保留吸积时的信息
- 吸积需足够慢、温度足够低
- 天问四号科学目标之一：弄清**木卫四内部结构**

因此对 CPD **晚期**吸积条件最敏感

.footnote[Anderson et al. 2001, Icarus；Canup &amp;amp; Ward 2002, AJ；Barr &amp;amp; Canup 2008, Icarus；NASA/JPL PIA01082]

???
如果吸积太快或 CPD 太热，木卫四会被加热到完全分异，与前面讲的 C/MR² ≈ 0.355 矛盾。
部分分异本身就是对 CPD 晚期温度与吸积时标的约束。
形成端给出分异程度、冰–岩比、海洋存在与否的先验，供天问四号重力/潮汐反演对照。

## 天问四号

- 木星系探测，木卫四为重点目标之一；服务其科学目标
- 与 **JUICE**、**Europa Clipper** 协同
- 可测：
  - 重力场 → 转动惯量、密度分层与分异程度
  - 潮汐（Love 数 `\(k_2\)`）→ 内部流变与液体层
  - 磁感应 / 表面成分 → 地下海洋、冰–岩比


???
把形成约束落到可测量量：重力 → C/MR² 与分层；潮汐 k₂ → 液体层/流变；磁感应 → 导电海洋；光谱 → 冰岩。
不同撞击时标给出不同的分异—海洋先验，帮助解释天问四号的重力场与潮汐测量、降低反演简并。

# 总结

.medium-text[
- 木星系记录了 **PPD → CPD 过渡**时的物质分配与动力学
- 早期大撞击可解释**稀释核**；撞击发生在失控气体吸积之后
- 撞击设定 CPD 的初始热状态与成分
- CPD 模型结合 JWST 光谱，约束盘质量、结构、尘埃与热条件
- 木卫四对 CPD 晚期吸积条件最敏感
- 天问四号等任务可用重力场与潮汐测量检验形成预言
]
